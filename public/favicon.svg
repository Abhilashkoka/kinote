<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Tile with Smooth Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="6" />

  <!-- Shield Outline (Family Care & Protection) -->
  <path d="M256 90 L380 145 C380 270 256 370 256 400 C256 370 132 270 132 145 Z" 
        fill="#134e4a" 
        fill-opacity="0.6" 
        stroke="#2dd4bf" 
        stroke-width="12" 
        stroke-linejoin="round" />

  <!-- Biometric ECG Heartbeat Pulse Line -->
  <path d="M165 245 L205 245 L225 210 L245 285 L268 180 L292 295 L310 245 L347 245" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Heart Dot Indicator -->
  <circle cx="268" cy="180" r="10" fill="#ffffff" filter="url(#glow)" />
</svg>
